name: CI

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      external_registries:
        description: Run original public-registry compatibility tests
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    name: Analysis and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obtain repository code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the project's Go version
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Static analysis
        run: go vet -mod=vendor ./...
      - name: Local unit tests
        run: go test -mod=vendor -count=1 -timeout=5m ./manifest/image ./manifest/loader ./manifest/imagescanner ./tape/app
      - name: Complete suite (controlled local registry)
        run: go test -mod=vendor -count=1 -timeout=10m ./...
      - name: Optional public-registry compatibility tests
        if: github.event_name == 'workflow_dispatch' && inputs.external_registries
        env:
          TAPE_EXTERNAL_TESTS: "1"
        run: go test -mod=vendor -count=1 -timeout=10m ./...

  image:
    name: Build, check and optionally publish image
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Obtain repository code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Define image reference
        id: reference
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: echo "tag=ghcr.io/${REPOSITORY,,}:sha-${REVISION}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image without publishing
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.reference.outputs.tag }}
      - name: Check the Tape executable
        env:
          IMAGE: ${{ steps.reference.outputs.tag }}
        run: docker run --rm "$IMAGE" --help
      - name: Authenticate to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.reference.outputs.tag }}
        run: docker push "$IMAGE"
